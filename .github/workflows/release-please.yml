---
# Release Please: opens the release pull request from conventional commits, and
# when that pull request is merged, creates the tag and the GitHub release, then
# calls release.yml for it. Both run from main only: the Talos runner group
# admits release-please.yml and release.yml at refs/heads/main and nothing else
# of this repository, so the release reaches the internal services and a tag,
# a branch or a fork cannot. The release job waits for approval (environment
# release).
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ['self-hosted', 'talos']
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: Depthmark/github-sts-action@9014c80f47cad81e0a1295b112714d5c1b219d54 # v0.3.0
        id: sts
        with:
          sts-url: https://github-sts-dev.adelisle.com
          scope: Depthmark-Lab/hello-world
          identity: release
          app: depthmark-release-bot
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.sts.outputs.token }}

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
